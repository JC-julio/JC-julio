name: Update README cards

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=JC-julio&show_icons=true&theme=transparent&include_all_commits=true&count_private=true'
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=JC-julio&layout=compact&langs_count=4&theme=transparent'
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/generated/profile
          cp profile/*.svg /tmp/generated/profile/

          git reset --hard
          git clean -fd

          if git ls-remote --exit-code --heads origin generated; then
            git checkout generated
          else
            git checkout --orphan generated
          fi

          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p profile
          cp /tmp/generated/profile/*.svg profile/
          touch .nojekyll

          git add profile .nojekyll
          git commit -m "chore: update README cards" || exit 0
          git push origin generated --force