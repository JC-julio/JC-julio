name: Update README cards

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=JC-julio&show_icons=true&theme=transparent&include_all_commits=true&count_private=true'
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=JC-julio&layout=compact&langs_count=4&theme=transparent'
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update README cards"
          git pull --rebase origin main
          git push origin main